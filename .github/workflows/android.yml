name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Get Version from build.gradle
      id: package-version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle | cut -d '"' -f 2)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup Keystore
      run: |
        if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
          echo "Using existing keystore from secrets"
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > app/debug.keystore
        else
          echo "Generating new keystore as no secret was found"
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          echo "!! CAUTION: No ANDROID_DEBUG_KEYSTORE_B64 secret found.             !!"
          echo "!! A new keystore has been generated for this build.               !!"
          echo "!! To persist this key for future releases, encode it to Base64 and !!"
          echo "!! save it as ANDROID_DEBUG_KEYSTORE_B64 in your GitHub Secrets.    !!"
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          echo "Base64 encoded keystore (copy this to secrets):"
          base64 app/debug.keystore | tr -d '\n'
          echo ""
        fi

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v${{ steps.package-version.outputs.VERSION }}
        name: Omni Web v${{ steps.package-version.outputs.VERSION }}
        body: |
          Automated build for version ${{ steps.package-version.outputs.VERSION }}.

          Note: If this is the first build, ensure you save the Base64 keystore from the 'Setup Keystore' step logs into your GitHub Secrets as ANDROID_DEBUG_KEYSTORE_B64 for persistent signing.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        prerelease: false
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
