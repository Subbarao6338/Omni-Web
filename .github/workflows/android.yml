name: Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Get Version
      id: get_version
      run: |
        VERSION_NAME=$(grep 'appVersionName' variables.gradle | cut -d "'" -f 2)
        VERSION_CODE=$(grep 'appVersionCode' variables.gradle | sed 's/[^0-9]//g')
        SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        else
          TAG_NAME="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
        fi

        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "APK_NAME=OmniWeb-${TAG_NAME}.apk" >> $GITHUB_OUTPUT

    - name: Setup Keystore
      run: |
        if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" ]; then
          echo "Using existing keystore from secrets"
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > app/debug.keystore
        else
          echo "Generating new keystore as no secret was found"
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          echo "!! CAUTION: No ANDROID_DEBUG_KEYSTORE_B64 secret found.             !!"
          echo "!! A new keystore has been generated for this build.               !!"
          echo "!! To persist this key for future releases, encode it to Base64 and !!"
          echo "!! save it as ANDROID_DEBUG_KEYSTORE_B64 in your GitHub Secrets.    !!"
          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          echo "Base64 encoded keystore (copy this to secrets):"
          base64 app/debug.keystore | tr -d '\n'
          echo ""
        fi

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: app/build/reports/tests/

    - name: Upload Lint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports
        path: app/build/reports/lint-results-debug.html

    - name: Build with Gradle
      env:
        APP_VERSION_NAME: ${{ steps.get_version.outputs.TAG_NAME }}
        APP_VERSION_CODE: ${{ steps.get_version.outputs.VERSION_CODE }}
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Prepare APK for Release
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ${{ steps.get_version.outputs.APK_NAME }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.get_version.outputs.APK_NAME }}
        path: ${{ steps.get_version.outputs.APK_NAME }}
        retention-days: 7

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
        name: Omni Web ${{ steps.get_version.outputs.TAG_NAME }}
        body: |
          Automated build for version ${{ steps.get_version.outputs.VERSION_NAME }}.
          Tag: ${{ steps.get_version.outputs.TAG_NAME }}

          Note: If this is the first build, ensure you save the Base64 keystore from the 'Setup Keystore' step logs into your GitHub Secrets as ANDROID_DEBUG_KEYSTORE_B64 for persistent signing.
        files: |
          ${{ steps.get_version.outputs.APK_NAME }}
        prerelease: false
        make_latest: true
        generate_release_notes: true
        allowUpdates: true
        target_commitish: ${{ github.sha }}
        fail_on_unmatched_files: true
